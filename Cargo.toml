[package]
name = "freefitty"
version = "0.1.0"
edition = "2021"
description = "Durable agents on a cluster of Strix Halos: one Rust binary, one data file, no cloud stand-ins."
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs", "process", "io-util"] }
axum = { version = "0.8", features = ["json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4"
clap = { version = "4", features = ["derive"] }
toml = "0.9"
chrono = "0.4"
chrono-tz = "0.10"
rand = "0.9"
bytes = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
