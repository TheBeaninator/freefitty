# Tests and supply-chain checks on every push; on a v* tag, a release binary with its checksum and SBOM, built on
# Ubuntu 22.04 (glibc 2.35) so it runs on the pod's 24.04 and anything newer. What lands on a host can then be
# checked against the release: `sha256sum freefitty` and `freefitty --version` (the commit it was built from).
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.99.1 # rust-toolchain.toml
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.99.1 # rust-toolchain.toml
      - run: cargo build --release --locked
      - run: cargo install cargo-cyclonedx --version 0.5.10 --locked && cargo cyclonedx --format json
      - run: |
          cp target/release/freefitty freefitty-linux-x86_64
          cp "$(ls *.cdx.json | head -1)" freefitty.cdx.json
          ./freefitty-linux-x86_64 --version | tee VERSION
          sha256sum freefitty-linux-x86_64 freefitty.cdx.json > SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            freefitty-linux-x86_64
            freefitty.cdx.json
            SHA256SUMS
            VERSION
