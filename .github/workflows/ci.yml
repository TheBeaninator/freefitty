# Tests and supply-chain checks on every push; on a v* tag, a release binary with its checksum and SBOM, built on
# Ubuntu 22.04 (glibc 2.35) so it runs on the pod's 24.04 and anything newer. What lands on a host can then be
# checked against the release: `sha256sum freefitty` and `freefitty --version` (the commit it was built from).
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo install cargo-cyclonedx --locked && cargo cyclonedx --format json
      - run: |
          cp target/release/freefitty freefitty-linux-x86_64
          cp "$(ls *.cdx.json | head -1)" freefitty.cdx.json
          ./freefitty-linux-x86_64 --version | tee VERSION
          sha256sum freefitty-linux-x86_64 freefitty.cdx.json > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            freefitty-linux-x86_64
            freefitty.cdx.json
            SHA256SUMS
            VERSION
